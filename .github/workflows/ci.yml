name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  infra-validate:
    name: Infra Validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Docker Compose config
        run: docker compose -f infra/docker-compose.yml config -q

  server:
    name: Server Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: resonance
          POSTGRES_PASSWORD: resonance
          POSTGRES_DB: resonance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U resonance"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://resonance:resonance@localhost:5432/resonance_test

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Validate demo fixture (non-blocking)
        continue-on-error: true
        run: node ./scripts/demo/validate-fixture.mjs

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Dependency audit (high+ prod only)
        working-directory: server
        run: npm audit --audit-level=high --omit=dev

      - name: Lint
        working-directory: server
        run: npm run lint

      - name: Format check
        working-directory: server
        run: npm run format:check

      - name: Secret scan
        run: ./scripts/secret-scan.sh

      - name: Build artifact guard
        run: ./scripts/check-no-build-artifacts.sh

      - name: Generate Prisma client
        working-directory: server
        run: npm run prisma:generate

      - name: Run migrations
        working-directory: server
        run: npm run prisma:migrate

      - name: Build (typecheck)
        working-directory: server
        run: npm run build

      - name: Test with coverage
        working-directory: server
        run: npx vitest run --coverage
