name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  infra-validate:
    name: Infra Validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Docker Compose config
        run: docker compose -f infra/docker-compose.yml config -q

  server:
    name: Server Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: resonance
          POSTGRES_PASSWORD: resonance-${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_DB: resonance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U resonance"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      PORT: 4000
      AUTH_MODE: dev
      DEV_UNIVERSITY_NAME: Mock University Conservatory
      DEV_LOGIN_CALLBACK_URL: resonance://auth-callback
      # CI-only local MinIO credentials — not used in production
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: resonance-dev
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_FORCE_PATH_STYLE: "true"

    steps:
      - name: Initialize ephemeral test credentials
        env:
          POSTGRES_PASSWORD: resonance-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          jwt_secret="$(openssl rand -hex 32)"
          database_url="postgresql://resonance:${POSTGRES_PASSWORD}@localhost:5432/resonance_test"
          {
            echo "DATABASE_URL=$database_url"
            echo "JWT_SECRET=$jwt_secret"
          } >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Validate demo fixture (non-blocking)
        continue-on-error: true
        run: node ./scripts/demo/validate-fixture.mjs

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Dependency audit (high+ prod only)
        working-directory: server
        run: npm audit --audit-level=high --omit=dev

      - name: Lint
        working-directory: server
        run: npm run lint

      - name: Format check
        working-directory: server
        run: npm run format:check

      - name: Secret scan
        run: ./scripts/secret-scan.sh

      - name: Build artifact guard
        run: ./scripts/check-no-build-artifacts.sh

      - name: Shellcheck scripts
        run: docker run --rm -v "$PWD:/mnt" -w /mnt --entrypoint sh koalaman/shellcheck-alpine:stable -lc 'shellcheck -s bash scripts/*.sh scripts/demo/*.sh'

      - name: Lint GitHub Actions workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7

      - name: Generate Prisma client
        working-directory: server
        run: npm run prisma:generate

      - name: Run migrations
        working-directory: server
        run: npm run prisma:migrate

      - name: Build (typecheck)
        working-directory: server
        run: npm run build

      - name: Start MinIO
        run: |
          docker run -d --name resonance-minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e \
            server /data
          for _ in {1..30}; do
            if curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs resonance-minio
          exit 1

      - name: Runtime health probe
        working-directory: server
        run: npm run start >/tmp/resonance-server.log 2>&1 & SERVER_PID=$!; trap 'kill "$SERVER_PID"' EXIT; for _ in {1..30}; do if curl -fsS http://127.0.0.1:4000/health >/dev/null; then exit 0; fi; sleep 1; done; cat /tmp/resonance-server.log; exit 1

      - name: Test with coverage
        working-directory: server
        run: npx vitest run --coverage

      - name: E2E tests
        working-directory: server
        run: npm run test:e2e

  ios:
    name: iOS Build
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Build iOS package for simulator
        run: ./scripts/verify-ios.sh
