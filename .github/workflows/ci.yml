# Verifies infrastructure, server, documentation, and both supported Swift toolchains.
name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  infra-validate:
    name: Infra Validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Docker Compose config
        run: docker compose -f infra/docker-compose.yml config -q

  server:
    name: Server Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18.4@sha256:c2d42a104eb6b37b286a2d9c5cf83f349de4d6516d513d00a2bd9610e2c2e5e4
        env:
          POSTGRES_USER: resonance
          POSTGRES_PASSWORD: resonance-${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_DB: resonance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U resonance"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      PORT: 4000
      AUTH_MODE: dev
      DEV_UNIVERSITY_NAME: Mock University Conservatory
      DEV_LOGIN_CALLBACK_URL: resonance://auth-callback
      # CI-only local MinIO credentials, not used in production
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: resonance-dev
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_FORCE_PATH_STYLE: "true"

    steps:
      - name: Initialize ephemeral test credentials
        env:
          POSTGRES_PASSWORD: resonance-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          jwt_secret="$(openssl rand -hex 32)"
          database_url="postgresql://resonance:${POSTGRES_PASSWORD}@localhost:5432/resonance_test"
          {
            echo "DATABASE_URL=$database_url"
            echo "JWT_SECRET=$jwt_secret"
          } >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Verify Node runtime
        run: node ./scripts/check-node-version.mjs

      - name: Validate demo fixture
        run: node ./scripts/demo/validate-fixture.mjs

      - name: Validate static Pages demo
        run: node ./scripts/demo/validate-static-site.mjs

      - name: Validate public documentation and screenshots
        run: node ./scripts/validate-public-docs.mjs

      - name: Test repository policy scripts
        run: node --test tests/repository/*.test.mjs

      - name: Validate destructive test database target
        run: node ./scripts/assert-test-database-url.mjs

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Dependency audit (high+ prod only)
        working-directory: server
        run: npm audit --audit-level=high --omit=dev

      - name: Lint
        working-directory: server
        run: npm run lint

      - name: Dead-code check
        working-directory: server
        run: npm run quality:dead-code

      - name: Duplication check
        working-directory: server
        run: npm run quality:duplicates

      - name: Format check
        working-directory: server
        run: npm run format:check

      - name: Secret scan
        run: ./scripts/secret-scan.sh

      - name: Build artifact guard
        run: ./scripts/check-no-build-artifacts.sh

      - name: Shellcheck scripts
        run: docker run --rm -v "$PWD:/mnt" -w /mnt --entrypoint sh koalaman/shellcheck-alpine:stable -lc 'shellcheck -s bash scripts/*.sh scripts/demo/*.sh'

      - name: Lint GitHub Actions workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12

      - name: Generate Prisma client
        working-directory: server
        run: npm run prisma:generate

      - name: Run migrations
        working-directory: server
        run: npm run prisma:migrate

      - name: Build (typecheck)
        working-directory: server
        run: npm run build

      - name: Start MinIO
        run: |
          docker run -d --name resonance-minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e \
            server /data
          for _ in {1..30}; do
            if curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs resonance-minio
          exit 1

      - name: Runtime readiness probe
        working-directory: server
        run: |
          node dist/index.js >/tmp/resonance-server.log 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" >/dev/null 2>&1 || true
            # The server has three independent five-second shutdown budgets.
            for _ in {1..200}; do
              if ! kill -0 "$server_pid" >/dev/null 2>&1; then
                wait "$server_pid" 2>/dev/null || true
                return
              fi
              sleep 0.1
            done
            kill -KILL "$server_pid" >/dev/null 2>&1 || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          for _ in {1..30}; do
            if curl -fsS http://127.0.0.1:4000/ready >/dev/null; then
              trap - EXIT
              cleanup
              exit 0
            fi
            sleep 1
          done
          cat /tmp/resonance-server.log
          trap - EXIT
          cleanup
          exit 1

      - name: Test with coverage
        working-directory: server
        run: npx vitest run --coverage

      - name: E2E tests
        working-directory: server
        run: npm run test:e2e

  ios:
    name: iOS Build
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install pinned SwiftLint
        run: |
          brew install swiftlint
          test "$(swiftlint version)" = "0.63.2"

      - name: Lint Swift sources and tests
        run: ./scripts/lint-swift.sh lint

      - name: Build and test with Xcode-bundled Swift
        env:
          IOS_COMPILER_LOG_PATH: ${{ runner.temp }}/resonance-xcodebuild.log
        run: ./scripts/verify-ios.sh

      - name: Analyze compiled Swift
        run: ./scripts/lint-swift.sh analyze "${{ runner.temp }}/resonance-xcodebuild.log"

      - name: Install exact Swift 6.3.3 toolchain
        run: ./scripts/install-swift-toolchain.sh

      - name: Build and test with exact Swift 6.3.3
        env:
          IOS_TOOLCHAIN: swift
          IOS_EXPECTED_SWIFT_VERSION: 6.3.3
        run: ./scripts/verify-ios.sh
