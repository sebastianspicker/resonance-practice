# Verifies infrastructure, server, documentation, and both supported Swift toolchains.
name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  infra-validate:
    name: Infra Validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Docker Compose config
        run: docker compose -f infra/docker-compose.yml config -q

  server:
    name: Server Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18.4@sha256:c2d42a104eb6b37b286a2d9c5cf83f349de4d6516d513d00a2bd9610e2c2e5e4
        env:
          POSTGRES_USER: resonance
          POSTGRES_PASSWORD: resonance-${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_DB: resonance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U resonance"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      PORT: 4000
      AUTH_MODE: dev
      DEV_UNIVERSITY_NAME: Mock University Conservatory
      DEV_LOGIN_CALLBACK_URL: resonance://auth-callback
      # CI-only credentials for the Compose S3 service, not used in production
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: resonance-dev
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_FORCE_PATH_STYLE: "true"

    steps:
      - name: Initialize ephemeral test credentials
        env:
          POSTGRES_PASSWORD: resonance-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          jwt_secret="$(openssl rand -hex 32)"
          jwt_refresh_secret="$(openssl rand -hex 32)"
          database_url="postgresql://resonance:${POSTGRES_PASSWORD}@localhost:5432/resonance_test"
          {
            echo "DATABASE_URL=$database_url"
            echo "JWT_SECRET=$jwt_secret"
            echo "JWT_REFRESH_SECRET=$jwt_refresh_secret"
          } >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Verify repository
        run: ./scripts/verify-repository.sh

      - name: Validate destructive test database target
        run: node ./scripts/assert-database-target.mjs

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Dependency audit (high+ prod only)
        working-directory: server
        run: npm audit --audit-level=high --omit=dev

      - name: Lint
        working-directory: server
        run: npm run lint

      - name: Dead-code check
        working-directory: server
        run: npm run quality:dead-code

      - name: Duplication check
        working-directory: server
        run: npm run quality:duplicates

      - name: Format check
        working-directory: server
        run: npm run format:check

      - name: Shellcheck scripts
        run: docker run --rm -v "$PWD:/mnt" -w /mnt --entrypoint sh koalaman/shellcheck-alpine:stable -lc 'shellcheck -s bash scripts/*.sh scripts/demo/*.sh'

      - name: Lint GitHub Actions workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12

      - name: Generate Prisma client
        working-directory: server
        run: npm run prisma:generate

      - name: Run migrations
        working-directory: server
        run: npm run prisma:migrate

      - name: Build (typecheck)
        working-directory: server
        run: npm run build

      - name: Start S3-compatible storage
        run: docker compose -f infra/docker-compose.yml up -d --wait s3

      - name: Runtime readiness probe
        working-directory: server
        run: |
          node dist/app/index.js >/tmp/resonance-server.log 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" >/dev/null 2>&1 || true
            # The server has three independent five-second shutdown budgets.
            for _ in {1..200}; do
              if ! kill -0 "$server_pid" >/dev/null 2>&1; then
                wait "$server_pid" 2>/dev/null || true
                return
              fi
              sleep 0.1
            done
            kill -KILL "$server_pid" >/dev/null 2>&1 || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          for _ in {1..30}; do
            if curl -fsS http://127.0.0.1:4000/ready >/dev/null; then
              trap - EXIT
              cleanup
              exit 0
            fi
            sleep 1
          done
          cat /tmp/resonance-server.log
          trap - EXIT
          cleanup
          exit 1

      - name: Run compact server suite
        working-directory: server
        run: npm test

  ios-toolchain:
    name: iOS (${{ matrix.toolchain }})
    runs-on: macos-26
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        toolchain: [xcode, swift]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install pinned SwiftLint
        if: matrix.toolchain == 'xcode'
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/SwiftLint.pkg" \
            "https://github.com/realm/SwiftLint/releases/download/0.63.2/SwiftLint.pkg"
          sudo installer -pkg "$RUNNER_TEMP/SwiftLint.pkg" -target /
          test "$(swiftlint version)" = "0.63.2"

      - name: Lint Swift sources and tests
        if: matrix.toolchain == 'xcode'
        run: ./scripts/lint-swift.sh lint

      - name: Build and test with Xcode-bundled Swift
        if: matrix.toolchain == 'xcode'
        env:
          IOS_COMPILER_LOG_PATH: ${{ runner.temp }}/resonance-xcodebuild.log
        run: ./scripts/verify-ios.sh

      - name: Analyze compiled Swift
        if: matrix.toolchain == 'xcode'
        run: ./scripts/lint-swift.sh analyze "${{ runner.temp }}/resonance-xcodebuild.log"

      - name: Install exact Swift 6.3.3 toolchain
        if: matrix.toolchain == 'swift'
        run: ./scripts/install-swift-toolchain.sh

      - name: Build and test with exact Swift 6.3.3
        if: matrix.toolchain == 'swift'
        env:
          IOS_TOOLCHAIN: swift
          IOS_EXPECTED_SWIFT_VERSION: 6.3.3
        run: ./scripts/verify-ios.sh

  ios:
    # Preserve the existing required-check name while toolchains run independently.
    name: iOS Build
    needs: ios-toolchain
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require both toolchains
        env:
          TOOLCHAIN_RESULT: ${{ needs.ios-toolchain.result }}
        run: test "$TOOLCHAIN_RESULT" = success
