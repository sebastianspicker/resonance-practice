name: CI

on:
  push:
    branches: ["dev"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  infra-validate:
    name: Infra Validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Docker Compose config
        run: docker compose -f infra/docker-compose.yml config -q

  server:
    name: Server Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: resonance
          POSTGRES_PASSWORD: resonance
          POSTGRES_DB: resonance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U resonance"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://resonance:resonance@localhost:5432/resonance_test
      PORT: 4000
      AUTH_MODE: dev
      # CI-only test value — not a real secret; never use CHANGE-ME values in production
      JWT_SECRET: CHANGE-ME-generate-a-real-secret-at-least-32-chars
      DEV_UNIVERSITY_NAME: Mock University Conservatory
      DEV_LOGIN_CALLBACK_URL: resonance://auth-callback
      APP_BASE_URL: http://localhost:4000
      # CI-only local MinIO credentials — not used in production
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: resonance-dev
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_FORCE_PATH_STYLE: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Validate demo fixture (non-blocking)
        continue-on-error: true
        run: node ./scripts/demo/validate-fixture.mjs

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Dependency audit (high+ prod only)
        working-directory: server
        run: npm audit --audit-level=high --omit=dev

      - name: Lint
        working-directory: server
        run: npm run lint

      - name: Format check
        working-directory: server
        run: npm run format:check

      - name: Secret scan
        run: ./scripts/secret-scan.sh

      - name: Build artifact guard
        run: ./scripts/check-no-build-artifacts.sh

      - name: Shellcheck scripts
        run: docker run --rm -v "$PWD:/mnt" -w /mnt --entrypoint sh koalaman/shellcheck-alpine:stable -lc 'shellcheck -s bash scripts/*.sh scripts/demo/*.sh'

      - name: Lint GitHub Actions workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7

      - name: Generate Prisma client
        working-directory: server
        run: npm run prisma:generate

      - name: Run migrations
        working-directory: server
        run: npm run prisma:migrate

      - name: Build (typecheck)
        working-directory: server
        run: npm run build

      - name: Runtime health probe
        working-directory: server
        run: npm run start >/tmp/resonance-server.log 2>&1 & SERVER_PID=$!; trap 'kill "$SERVER_PID"' EXIT; for _ in {1..30}; do if curl -fsS http://127.0.0.1:4000/health >/dev/null; then exit 0; fi; sleep 1; done; cat /tmp/resonance-server.log; exit 1

      - name: Test with coverage
        working-directory: server
        run: npx vitest run --coverage

  ios:
    name: iOS Build
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Build iOS package for simulator
        working-directory: ios/ResonanceApp
        run: |
          if find . -maxdepth 2 \( -name '*.xcodeproj' -o -name '*.xcworkspace' \) | grep -q .; then
            xcodebuild -scheme ResonanceApp -destination 'generic/platform=iOS Simulator' build-for-testing
          else
            echo "Skipping iOS CLI build: open Package.swift in Xcode; no project/workspace is tracked."
          fi
