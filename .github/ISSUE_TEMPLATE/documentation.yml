name: Documentation issue
description: Report inaccurate, missing, or unclear public documentation
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: "Thanks for improving the Resonance public alpha docs. Do not include credentials, private recordings, personal data, or unredacted logs."
  - type: input
    id: page
    attributes:
      label: Page or path
      description: Link the GitHub page or provide the repository path.
      placeholder: "docs/API.md or https://github.com/.../blob/main/docs/API.md"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is inaccurate or unclear?
      description: Quote only the minimum relevant text and explain the mismatch.
    validations:
      required: true
  - type: textarea
    id: current_evidence
    attributes:
      label: Current behavior or evidence
      description: Point to source, a command result, or another canonical document.
    validations:
      required: false
  - type: textarea
    id: suggested_change
    attributes:
      label: Suggested change
    validations:
      required: false
