version: 2
updates:
  # Node.js / npm dependencies
  - package-ecosystem: "npm"
    directory: "/server"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    groups:
      # Batch minor/patch updates to reduce PR noise
      production-minor:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      dev-minor:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions — keep SHA pins current
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
