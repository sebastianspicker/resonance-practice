# Applies test-appropriate complexity limits without weakening production linting.
included:
  - ios/ResonanceApp/Tests

excluded:
  - ios/ResonanceApp/.build
  - ios/ResonanceApp/ResonanceApp.xcodeproj

cyclomatic_complexity:
  warning: 10
  error: 15

function_body_length:
  warning: 60
  error: 100

file_length:
  warning: 800
  error: 1000

line_length:
  warning: 160
  error: 200
  ignores_comments: true
  ignores_urls: true

type_body_length:
  warning: 500
  error: 700

reporter: xcode
