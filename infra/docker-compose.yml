# Provides loopback-only disposable PostgreSQL and S3-compatible storage for development and CI.
services:
  postgres:
    image: postgres:18.4@sha256:c2d42a104eb6b37b286a2d9c5cf83f349de4d6516d513d00a2bd9610e2c2e5e4
    container_name: resonance-postgres
    environment:
      # Local development defaults only. Replace for any shared environment.
      POSTGRES_USER: resonance
      POSTGRES_PASSWORD: resonance
      POSTGRES_DB: resonance
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # PostgreSQL 18 uses a major-version-aware data layout below this path.
      # The alpha upgrade intentionally requires a disposable database reset.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resonance"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  s3:
    # SeaweedFS provides the S3 API for local development and CI. The archived
    # MinIO image can no longer be pulled. Production must use a supported,
    # patched S3-compatible service with managed credentials.
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    container_name: resonance-s3
    environment:
      # Local development defaults only; requests signed with other keys are
      # rejected. Replace for any shared environment.
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    command: server -s3 -dir=/data
    ports:
      - "127.0.0.1:9000:8333"
    volumes:
      - s3-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
  s3-data:
