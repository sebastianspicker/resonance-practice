---
# Codacy repository settings. Tool and pattern choices live in Codacy Cloud;
# this file only scopes the function-length metric (Lizard) away from
# data fixtures, seeds and benchmarks, which are long by nature, not by logic.
# Every other tool still analyses these files.
engines:
  lizard:
    exclude_paths:
      - "server/prisma/demoFixture.ts"
      - "server/prisma/seed.ts"
      - "server/benchmarks/**"
      - "ios/ResonanceApp/Sources/App/Demo/GuidedPracticeScreenshotFixture.swift"
      # Static presentation page: HTML template renderers, not product code.
      - "demo/site/**"
      # Lizard misreads this file's regex literals and merges functions into one.
      - "scripts/check-ios-layers.mjs"
# Single-job production functions over the nloc threshold carry an inline
# `#lizard forgives` comment instead, so the rest of their files stay measured.
